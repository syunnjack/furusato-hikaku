name: Deploy to Xserver (full app)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: sqlite3, pdo_sqlite

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Write production .env
        run: |
          cat > .env <<EOF
          APP_NAME="ふるさと納税比較"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          DB_CONNECTION=sqlite
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          CACHE_STORE=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          GA4_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
          RAKUTEN_APP_ID=${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY=${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID=${{ secrets.RAKUTEN_AFFILIATE_ID }}
          LINE_LOGIN_CHANNEL_ID=${{ secrets.LINE_LOGIN_CHANNEL_ID }}
          LINE_LOGIN_CHANNEL_SECRET=${{ secrets.LINE_LOGIN_CHANNEL_SECRET }}
          LINE_LOGIN_REDIRECT_URI=${{ secrets.APP_URL }}/line/callback
          LINE_MESSAGING_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_MESSAGING_CHANNEL_ACCESS_TOKEN }}
          LINE_MESSAGING_CHANNEL_SECRET=${{ secrets.LINE_MESSAGING_CHANNEL_SECRET }}
          EOF

      - name: Deploy files via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".git" --exclude=".github" --exclude="node_modules" --exclude="tests" --exclude="database/database.sqlite" --exclude="storage/app" --exclude="storage/logs" --exclude="storage/framework"
          path: ./
          remote_path: ${{ secrets.XSERVER_DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: '10022'
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run migrations and cache config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.XSERVER_DEPLOY_PATH }}"
            mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app
            touch database/database.sqlite
            chmod -R 775 storage database
            /usr/bin/php8.3 artisan migrate --force
            /usr/bin/php8.3 artisan config:cache
            /usr/bin/php8.3 artisan route:cache
            /usr/bin/php8.3 artisan view:cache
            # 総務省の現況調査データ（自治体ページの中身）。団体コードでのupsertなので
            # 毎回流しても結果は同じ。4MBのJSONを読むので明示的にメモリを渡す。
            # キャッシュ更新のあとに置き、ここで失敗しても配置済みのコードは動く状態にしておく。
            /usr/bin/php8.3 -d memory_limit=512M artisan db:seed --class=MunicipalitySeeder --force

      # カタログ同期は楽天APIの認証情報に依存する。ここが失敗しても、
      # ファイルの配置とマイグレーションは終わっているため、
      # デプロイ全体を失敗扱いにしない（同期の可否は下のログで分かる）。
      - name: Sync catalog (楽天APIの認証情報が必要)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.XSERVER_DEPLOY_PATH }}"
            /usr/bin/php8.3 artisan furusato:sync-catalog --pages=50 --delay=800
