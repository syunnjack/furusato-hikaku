name: Sync furusato catalog

on:
  schedule:
    # 03:20 JST（18:20 UTC）に実行していたが、サーバーへのSSHが毎回
    # タイムアウトして失敗し続けていた。昼の時間帯へ移す（13:20 JST）。
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 検索語1つあたりのページ数（検索語は30語ある）
        required: false
        default: '3'

concurrency:
  group: furusato-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync production catalog over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          command_timeout: 30m
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.XSERVER_DEPLOY_PATH }}"
            /usr/bin/php8.3 artisan furusato:sync-catalog --pages=${{ inputs.pages || '3' }} --delay=700
